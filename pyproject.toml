[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitfall"
version = "0.1.0"
description = "ORBITFALL — a single-screen neon-vector score-attack arcade game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
orbitfall = "game.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=4"]

[tool.setuptools]
packages = ["game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
