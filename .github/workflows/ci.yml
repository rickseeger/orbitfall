name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (headless pytest)
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies (pygame-ce + pytest)
        run: uv sync --dev

      - name: Run test suite (with >=90% coverage on the pure-logic core)
        run: uv run pytest --cov=game.physics --cov=game.waves --cov=game.state --cov-fail-under=90 --cov-report=term-missing
